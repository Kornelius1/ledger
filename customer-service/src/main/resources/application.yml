server:
  port: 8082

spring:
  application:
    name: customer-service
  config:
    import: optional:file:../.env/[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_customer}
    username: customer_admin
    password: ${CUSTOMER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update #gunakan validate atau none untuk production
    show-sql: true #matikan ketika di production
    properties:
      hibernate:
        format_sql: true