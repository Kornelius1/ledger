services:
  postgres-customer:
    image: postgres:16-alpine
    container_name: db_customer_container
    environment:
      POSTGRES_DB: db_customer
      POSTGRES_USER: customer_admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_customer_data:/var/lib/postgresql/data

  postgres-ledger:
    image: postgres:16-alpine
    container_name: db_ledger_container
    environment:
      POSTGRES_DB: db_ledger
      POSTGRES_USER: ledger_admin
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_ledger_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: redis_cache_container
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper_container
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka_broker_container
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  postgres_customer_data:
  postgres_ledger_data: